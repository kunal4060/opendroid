pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
}
rootProject.name = "OpenDroid"
include ':app'
// Wear OS companion (D7): separate application module with the SAME
// applicationId + signing as :app, as the Wearable Data Layer requires.
include ':wear'
